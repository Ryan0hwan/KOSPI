name: KR Scanners

on:
  schedule:
    # 시각은 UTC (한국 = UTC+9). 평일만
    - cron: "30 1 * * 1-5"    # 10:30 이평선만 (장중)
    - cron: "0 4 * * 1-5"     # 13:00 이평선만 (장중)
    - cron: "0 6 * * 1-5"     # 15:00 이평선만 (마감 30분 전, 장기 지지선 포함)
    - cron: "10 7 * * 1-5"    # 16:10 장 마감 후 전체 (이평선·미너비니 2종·삼각형·볼린저)
  workflow_dispatch:
    inputs:
      system:
        description: "실행할 시스템"
        type: choice
        options: [all, ma, trend, vcp, triangle, bb]
        default: all
      force:
        description: "휴장일·장 시간과 상관없이 가장 최근 거래일 기준으로 실행"
        type: boolean
        default: true
      diagnose:
        description: "진단할 종목 (VCP·삼각형만, 코드나 종목명. 예: 005930,에이피알 또는 005930@2026-01-05). 비우면 정상 스캔"
        type: string
        default: ""

env:
  FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
  SCAN_GROUPS: "kospi,kosdaq,watchlist"
  MIN_TURNOVER: "3000000000"      # 종목 목록: 20일 평균 거래대금 30억 원 이상
  MIN_PRICE: "1000"               # 1,000원 미만 제외
  MIN_DOLLAR_VOL: "2000000000"    # 각 시스템: 50일 평균 거래대금 20억 원 이상
  UNIVERSE_REUSE: "1"             # 아래 universe 단계에서 만든 목록을 그대로 사용
  PYTHONUNBUFFERED: "1"

jobs:
  # ① 한국 종목 목록 (거래대금 상위) — 하루 한 번 만들어 캐시, 다른 단계가 공유
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: state/common
          key: kr-universe-${{ github.run_id }}
          restore-keys: kr-universe-
      - name: 종목 목록 만들기 (오늘 이미 만들었으면 재사용)
        run: python -c "import krcommon as k; k._universe()"
        env:
          UNIVERSE_REUSE: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: universe
          path: state/common
          retention-days: 1

  # ② 각 시스템 (동시에 실행, 하나가 실패해도 나머지는 계속)
  scan:
    needs: universe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system: [ma, trend, vcp, triangle, bb]
    # 장중 회차는 이평선만, 마감 후·수동 실행은 선택한 시스템
    if: >-
      always() && needs.universe.result == 'success'
    steps:
      - name: 이번 회차에 실행할지 판단
        id: gate
        run: |
          S="${{ matrix.system }}"; RUN=0
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "10 7 * * 1-5" ] || [ "$S" = "ma" ]; then RUN=1; fi
          else
            SEL="${{ inputs.system }}"
            if [ "$SEL" = "all" ] || [ "$SEL" = "$S" ]; then RUN=1; fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == '1'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.run == '1'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.run == '1'
        uses: actions/download-artifact@v4
        with:
          name: universe
          path: state/common
      - if: steps.gate.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: state/${{ matrix.system }}
          key: kr-${{ matrix.system }}-${{ github.run_id }}
          restore-keys: kr-${{ matrix.system }}-
      - if: steps.gate.outputs.run == '1'
        run: python kr_${{ matrix.system }}.py
        env:
          DISCORD_WEBHOOK_URL: ${{ matrix.system == 'ma' && secrets.KR_WEBHOOK_MA || matrix.system == 'trend' && secrets.KR_WEBHOOK_TREND || matrix.system == 'vcp' && secrets.KR_WEBHOOK_VCP || matrix.system == 'triangle' && secrets.KR_WEBHOOK_TRIANGLE || secrets.KR_WEBHOOK_BB }}
          DIAGNOSE: ${{ (matrix.system == 'vcp' || matrix.system == 'triangle') && inputs.diagnose || '' }}

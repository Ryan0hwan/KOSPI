name: KR Market Flow

on:
  schedule:
    # 평일 18:30 (한국) = 09:30 UTC. 확정 수급이 반영된 뒤
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

jobs:
  marketflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python kr_marketflow.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.KR_WEBHOOK_MARKET }}
          MIN_MARCAP: "1000000000000"
          MIN_TURNOVER: "10000000000"
          PYTHONUNBUFFERED: "1"
